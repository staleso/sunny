<!doctype html>
<html>
<head>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title">Spond</h1>
    <p class="homey-subtitle">Logg inn med Spond-kontoen din.</p>
  </header>

  <fieldset class="homey-form-fieldset">
    <div class="homey-form-group">
      <label class="homey-form-label" for="email">E-post</label>
      <input class="homey-form-input" id="email" type="email" />
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="password">Passord</label>
      <input class="homey-form-input" id="password" type="password" />
    </div>
  </fieldset>

  <button id="save" class="homey-button-primary-full">Lagre</button>
  <p id="status" style="margin-top:1em"></p>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const status = document.getElementById('status');

      Homey.get('email', (err, v) => { if (v) email.value = v; });
      Homey.get('password', (err, v) => { if (v) password.value = v; });
      Homey.get('status', (err, v) => { status.textContent = v || ''; });
      Homey.on('settings.set', (key) => {
        if (key === 'status') Homey.get('status', (err, v) => { status.textContent = v || ''; });
      });

      document.getElementById('save').addEventListener('click', () => {
        Homey.set('email', email.value.trim(), (err) => { if (err) return Homey.alert(err); });
        Homey.set('password', password.value, (err) => {
          if (err) return Homey.alert(err);
          status.textContent = 'Lagret – henter arrangementer…';
        });
      });

      Homey.ready();
    }
  </script>
</body>
</html>

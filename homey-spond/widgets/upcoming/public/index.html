<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; padding: var(--homey-su-2, 8px); font-family: var(--homey-font-family-default, sans-serif); color: var(--homey-text-color, inherit); }
    h2 { margin: 0 0 6px; font-size: var(--homey-font-size-default, 15px); font-weight: var(--homey-font-weight-bold, 600); }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--homey-line-color, rgba(128,128,128,.25)); }
    li:first-child { border-top: 0; }
    .when { min-width: 52px; font-variant-numeric: tabular-nums; font-weight: 600; }
    .day { display: block; font-size: 11px; font-weight: 400; color: var(--homey-text-color-light, #888); }
    .title { font-weight: 500; }
    .meta { font-size: 12px; color: var(--homey-text-color-light, #888); }
    .badge { display:inline-block; margin-left:6px; padding:1px 6px; border-radius:8px; font-size:11px; background:#E5484D; color:#fff; vertical-align:middle; }
    .empty { color: var(--homey-text-color-light, #888); padding: 6px 0; }
  </style>
</head>
<body>
  <h2 id="head">Spond</h2>
  <ul id="list"><li class="empty">Laster…</li></ul>

  <script type="text/javascript">
    const tz = 'Europe/Oslo';
    const dayKey = (d) => d.toLocaleDateString('nb-NO', { timeZone: tz });

    function label(d) {
      const today = new Date();
      const tomorrow = new Date(Date.now() + 86400000);
      if (dayKey(d) === dayKey(today)) return 'I dag';
      if (dayKey(d) === dayKey(tomorrow)) return 'I morgen';
      return d.toLocaleDateString('nb-NO', { timeZone: tz, weekday: 'short', day: 'numeric', month: 'short' });
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    async function load(Homey) {
      const list = document.getElementById('list');
      const days = (Homey.getSettings() || {}).days || '7';
      try {
        const events = await Homey.api('GET', `/events?days=${days}`);
        const n = events.filter((e) => e.unanswered).length;
        document.getElementById('head').textContent = n ? `Spond · ${n} ubesvart${n === 1 ? '' : 'e'}` : 'Spond';
        if (!events.length) {
          list.innerHTML = '<li class="empty">Ingen arrangementer</li>';
        } else {
          list.innerHTML = events.map((e) => {
            const d = new Date(e.start);
            const time = d.toLocaleTimeString('nb-NO', { timeZone: tz, hour: '2-digit', minute: '2-digit' });
            const meta = [e.who, e.group, e.location].filter(Boolean).map(esc).join(' · ');
            return `<li><span class="when">${time}<span class="day">${esc(label(d))}</span></span>`
              + `<span><span class="title">${esc(e.title)}</span>${e.unanswered ? '<span class="badge">Ikke svart</span>' : ''}${meta ? `<br><span class="meta">${meta}</span>` : ''}</span></li>`;
          }).join('');
        }
      } catch (err) {
        list.innerHTML = `<li class="empty">Feil: ${esc(err.message || err)}</li>`;
      }
    }

    function onHomeyReady(Homey) {
      load(Homey).finally(() => Homey.ready());
      setInterval(() => load(Homey), 5 * 60 * 1000);
    }
  </script>
</body>
</html>

name: AI-nyheter

on:
  schedule:
    # To nye saker om dagen: ca. 07:40 og 15:40 norsk tid (UTC i cron)
    - cron: '40 5 * * *'
    - cron: '40 13 * * *'
  workflow_dispatch:
    inputs:
      articles:
        description: 'Antall saker å skrive (1–3)'
        default: '1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  write-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer avhengigheter
        run: npm install --no-save @anthropic-ai/sdk

      - name: Skriv nye saker
        run: node scripts/generate-news.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLES_PER_RUN: ${{ github.event.inputs.articles || '1' }}

      - name: Hent bilder (Wikimedia Commons)
        run: node scripts/fetch-images.mjs

      - name: Commit og push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' data/articles.json sitemap.xml img
          git diff --staged --quiet && exit 0
          git commit -m "AI-nyheter: $(date -u +'%Y-%m-%d %H:%M')"
          git push

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

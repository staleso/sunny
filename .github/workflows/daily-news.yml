name: AI-nyheter

on:
  schedule:
    # Én ny sak om dagen, ca. 07:40 norsk tid (UTC i cron).
    # GitHub hopper av og til over planlagte kjøringer, så det er to reservetider.
    # Er dagens sak allerede skrevet, avslutter de uten å bruke API-et.
    - cron: '40 5 * * *'
    - cron: '17 9 * * *'
    - cron: '23 13 * * *'
    - cron: '45 13 * * *'   # 14:45 norsk tid
  workflow_dispatch:
    inputs:
      articles:
        description: 'Antall saker å skrive (1–3)'
        default: '1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  write-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer avhengigheter
        run: npm install --no-save @anthropic-ai/sdk

      - name: Skriv nye saker
        run: node scripts/generate-news.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLES_PER_RUN: ${{ github.event.inputs.articles || '1' }}
          SKIP_IF_PUBLISHED_TODAY: ${{ github.event_name == 'schedule' && '1' || '' }}

      - name: Hent bilder (Wikimedia Commons)
        run: node scripts/fetch-images.mjs

      - name: Commit og push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' data/articles.json sitemap.xml img
          git diff --staged --quiet && exit 0
          git commit -m "AI-nyheter: $(date -u +'%Y-%m-%d %H:%M')"
          # Hvis main har endret seg mens saken ble skrevet: hent nyeste, bygg forsiden på nytt og prøv igjen.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main
            node scripts/build-news.mjs
            git add -A -- '*.html' data/articles.json sitemap.xml
            git diff --staged --quiet || git commit -m "Bygg forside på nytt"
          done
          exit 1

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
